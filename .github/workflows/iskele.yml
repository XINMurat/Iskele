name: CI

# Runs the İskele toolchain end to end on the worked example and checks that
# the shipped iskele.skill stays in sync with skill/iskele/.
#
# Scope note: this pipeline is a `runtime` arbiter for the GENERATOR'S
# ARITHMETIC and for package/template drift. It cannot judge whether a row
# marked `Tamamlandi` was actually verified against its acceptance criterion —
# that arbiter is human, and the Definition of Done is where it lives.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r skill/iskele/scripts/requirements.txt

      - name: Generator self-test (embedded regressions)
        run: python skill/iskele/scripts/progress.py --self-test

      - name: backlog markdown -> tracker.xlsx
        run: |
          set -e
          python skill/iskele/scripts/backlog_to_tracker.py \
            --backlog examples/backlog.example.md \
            --config examples/iskele.config.example.json \
            --out /tmp/tracker.xlsx
          test -s /tmp/tracker.xlsx

      - name: tracker.xlsx -> report summary (--check writes nothing)
        run: |
          set -e
          cp examples/07-ilerleme-raporu.example.html /tmp/report-before.html
          python skill/iskele/scripts/progress.py \
            --xlsx /tmp/tracker.xlsx \
            --html examples/07-ilerleme-raporu.example.html \
            --config examples/iskele.config.example.json --check
          diff -q /tmp/report-before.html examples/07-ilerleme-raporu.example.html \
            || { echo "FAIL: --check modified the report; it must be read-only." >&2; exit 1; }

      - name: Report generation rewrites only the GEN regions
        run: |
          set -e
          cp examples/07-ilerleme-raporu.example.html /tmp/report.html
          python skill/iskele/scripts/progress.py \
            --xlsx /tmp/tracker.xlsx --html /tmp/report.html \
            --config examples/iskele.config.example.json
          # Every marker pair must survive a write, otherwise the next run has
          # nowhere to write into and the report silently freezes.
          for m in $(grep -o 'GEN:[A-Za-z0-9_.-]*:BEGIN' /tmp/report.html | sed 's/:BEGIN//'); do
            grep -q "$m:END" /tmp/report.html \
              || { echo "FAIL: $m lost its END marker." >&2; exit 1; }
          done
          echo "OK: GEN markers intact after a write."

      - name: Self-test — a missing Hakem column reads "olculmedi", never %0
        run: |
          set -e
          # Reporting an unmeasured indicator as 0% is the silent-assumption
          # red line in its most damaging form: it looks like a measurement.
          python - <<'PY'
          import sys, re
          from openpyxl import load_workbook
          wb = load_workbook("/tmp/tracker.xlsx")
          ws = wb["Takip"]
          headers = [c.value for c in ws[1]]
          if "Hakem" not in headers:
              print("FAIL: backlog_to_tracker.py stopped emitting the Hakem column")
              sys.exit(1)
          # drop the column to simulate a tracker built by an older version
          ws.delete_cols(headers.index("Hakem") + 1)
          wb.save("/tmp/tracker-old.xlsx")
          PY
          cp examples/07-ilerleme-raporu.example.html /tmp/report-old.html
          python skill/iskele/scripts/progress.py \
            --xlsx /tmp/tracker-old.xlsx --html /tmp/report-old.html \
            --config examples/iskele.config.example.json | tee /tmp/old.log
          grep -q 'olculmedi' /tmp/old.log \
            || { echo "FAIL: a missing column was not reported as unmeasured" >&2; exit 1; }
          grep -q 'GEN:HAKEM:BEGIN' /tmp/report-old.html
          grep -q 'veri yok' /tmp/report-old.html \
            || { echo "FAIL: the report did not say the indicator is unmeasured" >&2; exit 1; }
          echo "OK: unmeasured stays unmeasured."

      - name: Self-test — a malformed estimate must be REJECTED
        run: |
          set -e
          # A parser that accepts an unknown estimate would weight the task
          # silently, which is exactly the "silent assumption" red line.
          cat > /tmp/bad-backlog.md <<'MD'
          ### Epik F0.1 — Test
          - [ ] **F0-INF-01** (Q) Gecersiz tahmin. **Bag.:** —
            - *Kabul:* n/a
          MD
          rm -f /tmp/bad.xlsx
          if python skill/iskele/scripts/backlog_to_tracker.py \
               --backlog /tmp/bad-backlog.md --out /tmp/bad.xlsx; then
            echo "FAIL: the parser accepted an unknown estimate" >&2; exit 1
          fi
          if [ -e /tmp/bad.xlsx ]; then
            echo "FAIL: a tracker was written despite the rejected input" >&2; exit 1
          fi
          echo "OK: the malformed task did not become a silently weighted row."

  handoff:
    # The İskele <-> Mizan/Kıyas loop is only real if the artifacts actually
    # cross. This job runs both adapters and hands the output to MIZAN'S OWN
    # validator, checked out from its repo — an arbiter this repo does not
    # control, which is the whole point. A claim of interop verified by the
    # tool making the claim would be class: author.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: XINMurat/Mizan
          path: _mizan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r skill/iskele/scripts/requirements.txt
          pip install -r _mizan/tools/requirements.txt

      - name: Kıyas seeds -> backlog tasks
        run: |
          set -e
          python skill/iskele/scripts/kiyas_to_backlog.py \
            --seeds examples/seeds-handoff.example.yaml \
            --phase F2 --layer X --out /tmp/from-seeds.md
          # Only H-aday seeds become work. A declined seed or a speculative one
          # turning into a task would mean the tier filter silently failed.
          grep -q 'F2-X-01' /tmp/from-seeds.md
          grep -q 'F2-X-02' /tmp/from-seeds.md
          test "$(grep -c '^- \[ \]' /tmp/from-seeds.md)" = "2" \
            || { echo "FAIL: tier filter let a non-H-aday seed become a task" >&2; exit 1; }
          grep -q 'KS-103' /tmp/from-seeds.md \
            || { echo "FAIL: the parked [S] seed vanished instead of staying visible" >&2; exit 1; }
          if grep -q 'KS-104' /tmp/from-seeds.md; then
            echo "FAIL: a declined seed became backlog content" >&2; exit 1
          fi
          grep -q 'TAHMIN: kalibresiz' /tmp/from-seeds.md \
            || { echo "FAIL: an unresolvable cost was weighted silently" >&2; exit 1; }
          echo "OK: seeds -> backlog respected tiers, declines and calibration."

      - name: Generated tasks must survive the tracker parser (round trip)
        run: |
          set -e
          python skill/iskele/scripts/backlog_to_tracker.py \
            --backlog /tmp/from-seeds.md --out /tmp/from-seeds.xlsx
          test -s /tmp/from-seeds.xlsx
          # A seed's arbiter must reach the tracker column too, otherwise the
          # report would call Kıyas-sourced work self-reported when it is not.
          python - <<'PY'
          import sys
          from openpyxl import load_workbook
          ws = load_workbook("/tmp/from-seeds.xlsx")["Takip"]
          h = {c.value: i for i, c in enumerate(ws[1])}
          rows = [r for r in ws.iter_rows(min_row=2, values_only=True) if r[0]]
          missing = [r[h["ID"]] for r in rows if not str(r[h["Hakem"]] or "").strip()]
          if missing:
              print("FAIL: the seed arbiter did not reach the Hakem column:", missing)
              sys.exit(1)
          print("OK: arbiter survives seed -> backlog -> tracker.")
          PY

      - name: backlog -> Mizan registry
        run: |
          set -e
          python skill/iskele/scripts/iskele_to_registry.py \
            --backlog examples/backlog.example.md \
            --project "Iskele CI" --owner "XINMurat" --out /tmp/registry.yaml
          python skill/iskele/scripts/iskele_to_registry.py \
            --backlog /tmp/from-seeds.md --out /tmp/registry-seeds.yaml

      - name: Mizan's own validator is the arbiter (R1–R17, --strict)
        run: |
          set -e
          cd _mizan
          python tools/mizan_validate.py --strict /tmp/registry.yaml
          python tools/mizan_validate.py --strict /tmp/registry-seeds.yaml

      - name: Self-test — a task with no arbiter must stay self-reported
        run: |
          set -e
          # Silent promotion is the failure this default exists to prevent: a
          # tracker column filled in by whoever did the work is self-report, and
          # Mizan R8 must see class: author so K-promotion stays closed.
          python - <<'PY'
          import sys, yaml
          reg = yaml.safe_load(open("/tmp/registry.yaml", encoding="utf-8"))
          classes = {h["id"]: h["arbiter"]["class"] for h in reg["hypotheses"]}
          bad = [k for k, v in classes.items() if v != "author"]
          if bad:
              print("FAIL: no-arbiter tasks were promoted above self-report:", bad)
              sys.exit(1)
          seeds = yaml.safe_load(open("/tmp/registry-seeds.yaml", encoding="utf-8"))
          got = {h["id"]: h["arbiter"]["class"] for h in seeds["hypotheses"]}
          if set(got.values()) != {"runtime"}:
              print("FAIL: a **Hakem:** line did not survive into the registry:", got)
              sys.exit(1)
          print("OK: arbiter class follows the backlog, in both directions.")
          PY

  counts-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Every manifest and reference count matches what is on disk
        run: |
          set -e
          # The manifest is described in five places and three languages, and
          # each one states a number. None of them was connected to anything
          # until this ran: an eleventh piece shipped and four documents still
          # said ten, while QUICKSTART claimed "yedisi zorunlu" over a table
          # showing eight. Nothing failed, because a number in prose is not a
          # check. This is the counting counterpart of the rule-range guard the
          # sibling repositories run over "R1-RN" claims.
          python tools/check_counts.py --verbose

      - name: Self-test - the count guard actually fires
        run: |
          set -e
          # A guard that has never failed is indistinguishable from a guard
          # that cannot fail, and a false negative agrees with you, which is
          # why it survives review. So break each class on purpose, require a
          # non-zero exit, and restore ONLY the file the fixture touched --
          # `git checkout -- .` would also revert whatever change is under
          # review in this very run.
          fail_expected() {
            if python tools/check_counts.py >/dev/null 2>&1; then
              echo "FAIL: the guard passed after: $1" >&2
              git checkout -- "$2"
              exit 1
            fi
            echo "ok  fires on: $1"
            git checkout -- "$2"
          }

          sed -i 's/The full kit is eleven pieces\./The full kit is ten pieces./' skill/iskele/SKILL.md
          fail_expected "a prose piece count that no longer matches the table" skill/iskele/SKILL.md

          python - <<'PY'
          import io
          p = "docs/QUICKSTART.md"
          s = io.open(p, encoding="utf-8").read()
          # Written through Python rather than sed: the fixture text is Turkish
          # and a runner whose locale mangles ç would turn a real check into
          # a silent no-op -- the exact failure this job exists to catch.
          before = s
          s = s.replace("On bir parça, dokuzu zorunlu.", "On bir parça, yedisi zorunlu.")
          assert s != before, "fixture sentence not found -- the self-test is testing nothing"
          io.open(p, "w", encoding="utf-8", newline="").write(s)
          PY
          fail_expected "a required-count claim that disagrees with the table above it" docs/QUICKSTART.md

          python - <<'PY'
          import io
          p = "docs/tr/metodoloji.md"
          s = io.open(p, encoding="utf-8").read()
          lines = s.splitlines(keepends=True)
          keep = [l for l in lines if not l.startswith("| 10 | `09-")]
          assert len(keep) < len(lines), "fixture row not found -- the self-test is testing nothing"
          io.open(p, "w", encoding="utf-8", newline="").write("".join(keep))
          PY
          fail_expected "a manifest row silently dropped from a mirror" docs/tr/metodoloji.md

          python - <<'PY'
          import io
          p = "docs/QUICKSTART.md"
          s = io.open(p, encoding="utf-8").read()
          before = s
          s = s.replace("| 10 | `09-kurtarma-rampalari.md` | ✓ |",
                        "| 10 | `09-kurtarma-rampalari.md` | — |")
          assert s != before, "fixture row not found -- the self-test is testing nothing"
          io.open(p, "w", encoding="utf-8", newline="").write(s)
          PY
          fail_expected "a required flag flipped in a mirror" docs/QUICKSTART.md

          git diff --exit-code
          echo "OK: the guard fires on all four classes, and the tree is clean."

  examples-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: examples/ copies must match the shipped templates
        run: |
          set -e
          # The examples are convenience copies of the templates. Nothing stops
          # the two from drifting except this check — and a drifted example
          # demonstrates a format the tooling no longer produces.
          diff -u skill/iskele/assets/templates/03-gorev-listesi.md examples/backlog.example.md \
            || { echo "examples/backlog.example.md has drifted from the template." >&2; exit 1; }
          diff -u skill/iskele/assets/templates/07-ilerleme-raporu.html examples/07-ilerleme-raporu.example.html \
            || { echo "examples/07-ilerleme-raporu.example.html has drifted from the template." >&2; exit 1; }
          diff -u skill/iskele/assets/iskele.config.example.json examples/iskele.config.example.json \
            || { echo "examples/iskele.config.example.json has drifted from the asset." >&2; exit 1; }

      - name: No real name reaches what gets published
        env:
          # Set this repository secret to a newline-separated list of names that
          # must never be published: clients, internal products, private repos.
          # Unset, the sweep reports NOT CONFIGURED and passes -- a repository
          # that has not set this up is not a repository that failed.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -e
          # From vaddermail/maestro-framework, check 14. The examples here use
          # invented names on purpose; that is the discipline, this is the net.
          # A real name in a tracked file is published the moment it is pushed,
          # and deleting it afterwards does not un-publish it.
          #
          # The tree and the package are swept separately: they are built by
          # different code, so a clean tree does not prove a clean iskele.skill.
          # A hit prints the file, the line and the term's index -- never the
          # term, because this log is public.
          python tools/leak_check.py --package iskele.skill

  skill-package-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: iskele.skill must match skill/iskele/ contents
        run: |
          python - <<'PY'
          import zipfile, os, sys
          def norm(b): return b.replace(b"\r\n", b"\n")
          z = zipfile.ZipFile("iskele.skill")
          names = set(z.namelist())
          bad = []
          # every packaged file must match its source
          for name in names:
              src = os.path.join("skill", name)   # arcname is iskele/... ; source is skill/iskele/...
              if not os.path.exists(src):
                  bad.append(f"{name}: packaged but missing from source"); continue
              if norm(z.read(name)) != norm(open(src, "rb").read()):
                  bad.append(f"{name}: content differs from skill/{name}")
          # every source file must be packaged
          for root, dirs, files in os.walk("skill/iskele"):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if f.endswith(".pyc"):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), "skill").replace(os.sep, "/")
                  if rel not in names:
                      bad.append(f"{rel}: in source but not packaged")
          if bad:
              print("iskele.skill is OUT OF SYNC with skill/iskele/:")
              for b in bad: print("  -", b)
              print("\nRebuild it (see CONTRIBUTING.md) and commit.")
              sys.exit(1)
          print("iskele.skill is in sync with skill/iskele/.")
          PY

  skill-scan:
    # A skill is code plus instructions that load into an agent's context and
    # run with the user's permissions, so this repo ships an attack surface,
    # not just a document. This job scans skill/iskele with skillvet
    # (github.com/V3r7ig0/skillvet) and fails on any high/critical finding.
    #
    # skillvet is pinned to a commit, not a branch: an unpinned security
    # scanner is itself a supply-chain hole, and a rule set that changes
    # under us turns a green run into a claim we cannot reproduce. Bumping
    # the pin is a deliberate commit, and the diff in findings is the point
    # of the bump.
    #
    # Only skills/skillvet is checked out. The upstream repo also carries 44
    # deliberately malicious benchmark fixtures; they are inert test data,
    # but there is no reason to put them on a runner, and endpoint AV
    # heuristics flag them on sight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the pinned scanner (scanner only, no benchmark corpus)
        run: |
          set -e
          git clone --quiet --filter=blob:none --no-checkout https://github.com/V3r7ig0/skillvet.git /tmp/skillvet
          git -C /tmp/skillvet sparse-checkout set --no-cone skills/skillvet
          git -C /tmp/skillvet checkout --quiet 025c8d8dd389fe92dbb21522b51385591653ba5d
          echo "skillvet pinned at $(git -C /tmp/skillvet rev-parse --short HEAD)"

      - name: Scan skill/iskele
        env:
          # The scanner prints a U+2192 in its verdict line; without this it
          # dies on any runner whose stdout is not UTF-8.
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python /tmp/skillvet/skills/skillvet/scripts/scan_skill.py skill/iskele --fail-on high
