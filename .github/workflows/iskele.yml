name: CI

# Runs the İskele toolchain end to end on the worked example and checks that
# the shipped iskele.skill stays in sync with skill/iskele/.
#
# Scope note: this pipeline is a `runtime` arbiter for the GENERATOR'S
# ARITHMETIC and for package/template drift. It cannot judge whether a row
# marked `Tamamlandi` was actually verified against its acceptance criterion —
# that arbiter is human, and the Definition of Done is where it lives.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r skill/iskele/scripts/requirements.txt

      - name: Generator self-test (embedded regressions)
        run: python skill/iskele/scripts/progress.py --self-test

      - name: backlog markdown -> tracker.xlsx
        run: |
          set -e
          python skill/iskele/scripts/backlog_to_tracker.py \
            --backlog examples/backlog.example.md \
            --config examples/iskele.config.example.json \
            --out /tmp/tracker.xlsx
          test -s /tmp/tracker.xlsx

      - name: tracker.xlsx -> report summary (--check writes nothing)
        run: |
          set -e
          cp examples/07-ilerleme-raporu.example.html /tmp/report-before.html
          python skill/iskele/scripts/progress.py \
            --xlsx /tmp/tracker.xlsx \
            --html examples/07-ilerleme-raporu.example.html \
            --config examples/iskele.config.example.json --check
          diff -q /tmp/report-before.html examples/07-ilerleme-raporu.example.html \
            || { echo "FAIL: --check modified the report; it must be read-only." >&2; exit 1; }

      - name: Report generation rewrites only the GEN regions
        run: |
          set -e
          cp examples/07-ilerleme-raporu.example.html /tmp/report.html
          python skill/iskele/scripts/progress.py \
            --xlsx /tmp/tracker.xlsx --html /tmp/report.html \
            --config examples/iskele.config.example.json
          # Every marker pair must survive a write, otherwise the next run has
          # nowhere to write into and the report silently freezes.
          for m in $(grep -o 'GEN:[A-Za-z0-9_.-]*:BEGIN' /tmp/report.html | sed 's/:BEGIN//'); do
            grep -q "$m:END" /tmp/report.html \
              || { echo "FAIL: $m lost its END marker." >&2; exit 1; }
          done
          echo "OK: GEN markers intact after a write."

      - name: Self-test — a malformed estimate must be REJECTED
        run: |
          set -e
          # A parser that accepts an unknown estimate would weight the task
          # silently, which is exactly the "silent assumption" red line.
          cat > /tmp/bad-backlog.md <<'MD'
          ### Epik F0.1 — Test
          - [ ] **F0-INF-01** (Q) Gecersiz tahmin. **Bag.:** —
            - *Kabul:* n/a
          MD
          rm -f /tmp/bad.xlsx
          if python skill/iskele/scripts/backlog_to_tracker.py \
               --backlog /tmp/bad-backlog.md --out /tmp/bad.xlsx; then
            echo "FAIL: the parser accepted an unknown estimate" >&2; exit 1
          fi
          if [ -e /tmp/bad.xlsx ]; then
            echo "FAIL: a tracker was written despite the rejected input" >&2; exit 1
          fi
          echo "OK: the malformed task did not become a silently weighted row."

  handoff:
    # The İskele <-> Mizan/Kıyas loop is only real if the artifacts actually
    # cross. This job runs both adapters and hands the output to MIZAN'S OWN
    # validator, checked out from its repo — an arbiter this repo does not
    # control, which is the whole point. A claim of interop verified by the
    # tool making the claim would be class: author.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: XINMurat/Mizan
          path: _mizan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r skill/iskele/scripts/requirements.txt
          pip install -r _mizan/tools/requirements.txt

      - name: Kıyas seeds -> backlog tasks
        run: |
          set -e
          python skill/iskele/scripts/kiyas_to_backlog.py \
            --seeds examples/seeds-handoff.example.yaml \
            --phase F2 --layer X --out /tmp/from-seeds.md
          # Only H-aday seeds become work. A declined seed or a speculative one
          # turning into a task would mean the tier filter silently failed.
          grep -q 'F2-X-01' /tmp/from-seeds.md
          grep -q 'F2-X-02' /tmp/from-seeds.md
          test "$(grep -c '^- \[ \]' /tmp/from-seeds.md)" = "2" \
            || { echo "FAIL: tier filter let a non-H-aday seed become a task" >&2; exit 1; }
          grep -q 'KS-103' /tmp/from-seeds.md \
            || { echo "FAIL: the parked [S] seed vanished instead of staying visible" >&2; exit 1; }
          if grep -q 'KS-104' /tmp/from-seeds.md; then
            echo "FAIL: a declined seed became backlog content" >&2; exit 1
          fi
          grep -q 'TAHMIN: kalibresiz' /tmp/from-seeds.md \
            || { echo "FAIL: an unresolvable cost was weighted silently" >&2; exit 1; }
          echo "OK: seeds -> backlog respected tiers, declines and calibration."

      - name: Generated tasks must survive the tracker parser (round trip)
        run: |
          set -e
          python skill/iskele/scripts/backlog_to_tracker.py \
            --backlog /tmp/from-seeds.md --out /tmp/from-seeds.xlsx
          test -s /tmp/from-seeds.xlsx

      - name: backlog -> Mizan registry
        run: |
          set -e
          python skill/iskele/scripts/iskele_to_registry.py \
            --backlog examples/backlog.example.md \
            --project "Iskele CI" --owner "XINMurat" --out /tmp/registry.yaml
          python skill/iskele/scripts/iskele_to_registry.py \
            --backlog /tmp/from-seeds.md --out /tmp/registry-seeds.yaml

      - name: Mizan's own validator is the arbiter (R1–R8)
        run: |
          set -e
          cd _mizan
          python tools/mizan_validate.py /tmp/registry.yaml
          python tools/mizan_validate.py /tmp/registry-seeds.yaml

      - name: Self-test — a task with no arbiter must stay self-reported
        run: |
          set -e
          # Silent promotion is the failure this default exists to prevent: a
          # tracker column filled in by whoever did the work is self-report, and
          # Mizan R8 must see class: author so K-promotion stays closed.
          python - <<'PY'
          import sys, yaml
          reg = yaml.safe_load(open("/tmp/registry.yaml", encoding="utf-8"))
          classes = {h["id"]: h["arbiter"]["class"] for h in reg["hypotheses"]}
          bad = [k for k, v in classes.items() if v != "author"]
          if bad:
              print("FAIL: no-arbiter tasks were promoted above self-report:", bad)
              sys.exit(1)
          seeds = yaml.safe_load(open("/tmp/registry-seeds.yaml", encoding="utf-8"))
          got = {h["id"]: h["arbiter"]["class"] for h in seeds["hypotheses"]}
          if set(got.values()) != {"runtime"}:
              print("FAIL: a **Hakem:** line did not survive into the registry:", got)
              sys.exit(1)
          print("OK: arbiter class follows the backlog, in both directions.")
          PY

  examples-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: examples/ copies must match the shipped templates
        run: |
          set -e
          # The examples are convenience copies of the templates. Nothing stops
          # the two from drifting except this check — and a drifted example
          # demonstrates a format the tooling no longer produces.
          diff -u skill/iskele/assets/templates/03-gorev-listesi.md examples/backlog.example.md \
            || { echo "examples/backlog.example.md has drifted from the template." >&2; exit 1; }
          diff -u skill/iskele/assets/templates/07-ilerleme-raporu.html examples/07-ilerleme-raporu.example.html \
            || { echo "examples/07-ilerleme-raporu.example.html has drifted from the template." >&2; exit 1; }
          diff -u skill/iskele/assets/iskele.config.example.json examples/iskele.config.example.json \
            || { echo "examples/iskele.config.example.json has drifted from the asset." >&2; exit 1; }

  skill-package-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: iskele.skill must match skill/iskele/ contents
        run: |
          python - <<'PY'
          import zipfile, os, sys
          def norm(b): return b.replace(b"\r\n", b"\n")
          z = zipfile.ZipFile("iskele.skill")
          names = set(z.namelist())
          bad = []
          # every packaged file must match its source
          for name in names:
              src = os.path.join("skill", name)   # arcname is iskele/... ; source is skill/iskele/...
              if not os.path.exists(src):
                  bad.append(f"{name}: packaged but missing from source"); continue
              if norm(z.read(name)) != norm(open(src, "rb").read()):
                  bad.append(f"{name}: content differs from skill/{name}")
          # every source file must be packaged
          for root, _, files in os.walk("skill/iskele"):
              for f in files:
                  rel = os.path.relpath(os.path.join(root, f), "skill").replace(os.sep, "/")
                  if rel not in names:
                      bad.append(f"{rel}: in source but not packaged")
          if bad:
              print("iskele.skill is OUT OF SYNC with skill/iskele/:")
              for b in bad: print("  -", b)
              print("\nRebuild it (see CONTRIBUTING.md) and commit.")
              sys.exit(1)
          print("iskele.skill is in sync with skill/iskele/.")
          PY
