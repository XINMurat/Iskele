title: "İskele — From a Vague Project Intent to an Executable Delivery Kit"
description: "A Claude skill that turns a vague project intent into a domain model, a phased roadmap with gates, an atomic backlog with acceptance criteria, quality gates, a tracker and a self-regenerating progress report. Bilingual EN/TR."
lang: en

# --- what this site is, for the shared layout ---
skill: "İskele"
emoji: "🏗️"
accent: "#7a5c2e"
accent_dark: "#c8a468"
repo: "https://github.com/XINMurat/Iskele"
family_label: "the family"
family_note: "Four skills that keep each other honest."
license_note: "Code MIT · prose CC BY 4.0."


# One nav per language, each COMPLETE. Overview and Quickstart are the same
# page in both languages (one file, two panes), so they appear in both lists
# under that language's name. There is no separate "main" nav any more: it was
# a second bar doing the first bar's job.
#
# The two lists are not the same length, and that is content rather than a
# defect -- some documents exist in Turkish only. Shown one at a time, a
# Turkish-only document reads as Turkish content instead of as a missing
# translation, which is what it is.
nav_en:
  - { name: "Overview", url: "/" }
  - { name: "Quickstart", url: "/QUICKSTART.html" }
  - { name: "Usage guide", url: "/en/usage-guide.html" }
nav_tr:
  - { name: "Genel bakış", url: "/" }
  - { name: "Hızlı başlangıç", url: "/QUICKSTART.html" }
  - { name: "Kullanım kılavuzu", url: "/tr/kullanim-kilavuzu.html" }
  - { name: "Metodoloji", url: "/tr/metodoloji.html" }
  - { name: "Alan modeli", url: "/tr/alan-modeli.html" }
  - { name: "Kit manifesti", url: "/tr/kit-manifesti.html" }
  - { name: "Takip", url: "/tr/takip.html" }
  - { name: "Kurtarma", url: "/tr/kurtarma.html" }

# Counterpart pages, for the language control on single-language documents.
# Only real pairs are listed: a page whose translation does not exist shows no
# control at all, because a button for a translation that does not exist
# promises one. Mizan's en/reference has no Turkish twin and Kiyas' and
# Iskele's Turkish-only documents have no English one -- those stay unpaired
# and say so by staying silent.
pairs:
  - { en: "/en/usage-guide", tr: "/tr/kullanim-kilavuzu" }

# The layout lives in docs/_layouts/default.html and is byte-identical in all
# four repositories. Everything that differs between them is here, in data --
# four copies of a stylesheet drifting one at a time is the failure this family
# names in its own documentation.
#
# NOTE: no `plugins:` key. Setting it would REPLACE the GitHub Pages default
# plugin set, and two of those defaults are load-bearing here:
# jekyll-optional-front-matter (most pages in docs/ carry none, and without it
# they stop being pages at all) and jekyll-relative-links (the .md links between
# them resolve on github.com and on the site because of it).

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
